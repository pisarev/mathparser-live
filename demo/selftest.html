    what the theme button did until 04.08.2026: it changed an attribute in the
    markup and wrote it down nowhere.

    The check walks EVERY control on the panel, moves each one off its current
    value, and demands the new value in what the page saves. It does not
    reload: a reload brings in the engine boot, the snapshot and the browser's
    throttling of hidden tabs, and none of that is what is being asked about
    here. The theme checks above cover the reload itself.

    A setting added to the panel tomorrow is covered by this the moment it
    appears, without anyone remembering to come here.
  */
  const saved = run(`
    (() => {
      const out = { fields: [], missing: [], extra: [] };
      const seen = {};

      /*
        Turn the proportion lock off first. With it on, width and height are one
        number and its consequence: whichever is typed last wins and the other
        follows. Walking the fields in order set the width, then the height, and
        the height put the width back - the check was catching its own
        arithmetic rather than a forgotten setting.
      */
      const lock = document.querySelector('.switch[data-opt="keepRatio"]');
      if (lock && lock.getAttribute('aria-pressed') === 'true') lock.onclick();

      document.querySelectorAll('.num[data-opt]').forEach(f => {
        const was = parseFloat(f.value.replace(',', '.'));
        // Move it off the current value rather than picking a number out of
        // the air: a zero width draws an empty canvas, and the check would be
        // measuring emptiness.
        const now = Number.isFinite(was) && was !== 0
          ? Math.round(was * 1.5 * 1000) / 1000 : 3;
        f.value = now;
        f.onchange();
        seen[f.dataset.opt] = now;
      });
      document.querySelectorAll('.switch[data-opt]').forEach(s => {
        if (s !== lock) s.onclick();
        seen[s.dataset.opt] = s.getAttribute('aria-pressed') === 'true';
      });

      const box = options();
      Object.keys(seen).forEach(k => {
        out.fields.push(k);
        // Width and height live in the view and travel as halves - the field
        // shows the full span. Compare the quantity, not the number.
        const want = seen[k];
        let got = box[k];
        if (k === 'maxX') got = view.w * 2;
        if (k === 'maxY') got = view.h * 2;
        if (k === 'centerX') got = view.cx;
        if (k === 'centerY') got = view.cy;
        const same = typeof want === 'boolean'
          ? got === want
          : Math.abs((got === undefined ? NaN : got) - want) < 1e-6;
        if (!same) out.missing.push(k + ': set ' + want + ', saved ' + got);
      });

      // Choices outside the panel: coordinate system, pen colour, formulas -
      // the page puts all of them into the session state beside the settings.
      const snapshot = state();
      if (!snapshot.cs) out.missing.push('cs: does not reach the state');
      if (!('penColor' in snapshot.options)) out.missing.push('penColor: does not reach the state');
      if (!Array.isArray(snapshot.formulas)) out.missing.push('formulas: do not reach the state');

      // The theme keeps a key of its own: the options object does not carry it.
      let stored = null;
      try {
        document.getElementById('themeBtn').click();
        stored = localStorage.getItem(THEME_KEY);
      } catch (e) {}
      if (stored !== (document.documentElement.dataset.theme || 'light'))
        out.missing.push('theme: the choice was not written down (' + stored + ')');

      return out;
    })();
  `);
  check("every control on the panel reaches what the page saves",
    saved.missing.length === 0,
    saved.missing.length ? saved.missing.join("; ")
                        : saved.fields.length + " controls checked");

  // Put the page back to a known state for anything that runs after.
  run(`(() => { try { localStorage.clear(); } catch (e) {} })();`);
  await load();

  heading("an empty sheet stays empty");

  /*
    Deleting every formula is a choice like any other, and it has to survive a
    reload. It did not: the page kept the built-in example under an empty list,
    the saved state was thrown away as "nothing worth restoring", and the two
    example curves came back at the next visit.

    The guard that threw it away is not a mistake in itself - a session recorded
    at a moment when nothing was built once wiped a plugin user's work, and the
    emptiness reproduced itself at every launch afterwards. So emptiness is now
    marked: deleted by hand is kept, happened by itself is still ignored.

    The coordinate system is checked alongside on purpose. The first version of
    the fix returned early on an empty list and never reached the line that
    applies it: the sheet came back empty and cartesian, having been emptied in
    polar.
  */
  const emptied = await (async () => {
    run(`
      (() => {
        try { localStorage.clear(); } catch (e) {}
        el('cs').querySelector('[data-cs="polar"]').click();
      })();
    `);
    await wait(900);
    run(`document.getElementById('clearBtn').click();`);
    await wait(900);
    const before = run(`
      (() => ({
        curves: curves.length,
        cs: el('cs').querySelector('[aria-pressed="true"]').dataset.cs
      }))();
    `);
    await load();
    /*
      Wait for the page to settle rather than for the clock: the saved state
      arrives once the engine is up, and a hidden tab holds timers back.
    */
    await new Promise(done => {
      const doc = frame.contentDocument;
      const target = doc && doc.getElementById("status");
      let watcher = null;
      const stop = () => { if (watcher) watcher.disconnect(); clearTimeout(guard); done(); };
      const guard = setTimeout(stop, 20000);
      const look = () => {
        if (run(`el('cs').querySelector('[aria-pressed="true"]').dataset.cs`) === "polar") stop();
      };
      if (target) {
        watcher = new MutationObserver(look);
        watcher.observe(target, { childList: true, characterData: true, subtree: true });
      }
      look();
    });
    const after = run(`
      (() => ({
        curves: curves.length,
        cs: el('cs').querySelector('[aria-pressed="true"]').dataset.cs,
        drawn: (data.seg || []).length
      }))();
    `);
    return { before, after };
  })();

  check("clearing the formulas empties the list",
    emptied.before.curves === 0, "curves " + emptied.before.curves);
  check("an empty sheet is still empty after a reload",
    emptied.after.curves === 0,
    "curves " + emptied.after.curves + " came back");
  check("nothing is drawn on the empty sheet",
    emptied.after.drawn === 0, "pieces " + emptied.after.drawn);
  check("emptying in polar comes back in polar",
    emptied.after.cs === "polar",
    "emptied in " + emptied.before.cs + ", came back in " + emptied.after.cs);

  // Put the page back to a known state for anything that runs after.
  run(`(() => { try { localStorage.clear(); } catch (e) {} })();`);
  restoreStorage();
  await load();

  finish();
})().catch(e => {
  /*
    A check that throws used to kill the whole run in silence: no row, no final
    line, and the page sat there looking as if it were still working. Twice in
    one day - a name declared twice inside a template literal, and a wait that
    never came back. An exception is a failure like any other, and it has to be
    written down as one.
  */
  check("the run reached its end", false, e && e.stack
    ? String(e.stack).split(String.fromCharCode(10)).slice(0, 2).join(" ") : String(e));
  { /* the set may fail; it may not carry somebody else's work away */ }
  restoreStorage();
  finish();
});

function finish() {
  const bad = rows.filter(r => !r.pass).length;
  const log = document.getElementById("log");
  log.innerHTML = bad
    ? "<span class='bad'>FAILURES: " + bad + " of " + rows.length + "</span>"
    : "<span class='ok'>all " + rows.length + " checks passed</span>";
}
</script>
</body>
</html>
